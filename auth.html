<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk / Daftar | Filosovet Petshop & Klinik Hewan</title>
<!-- CSS Utama -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- CSS Komponen Terpisah -->
  <link rel="stylesheet" href="components/header.css">
  <link rel="stylesheet" href="components/footer.css">
  
  <!-- CSS Mode Malam -->
  <link rel="stylesheet" href="css/dark.css">
<script>
  if (localStorage.getItem('fv_theme') === 'dark' || (!localStorage.getItem('fv_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark-mode');
  } else {
    document.documentElement.classList.remove('dark-mode');
  }
</script>
</head>
<body>
<div id="header-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <h1>Akun Filosovet</h1>
    <div class="breadcrumb"><a href="index.html">Beranda</a> / Masuk / Daftar</div>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:480px">
    <div class="card">
      <div class="tabs" style="margin-bottom:1.8rem">
        <button class="tab active" id="tabLogin" style="flex:1">Masuk</button>
        <button class="tab" id="tabRegister" style="flex:1">Daftar Akun</button>
      </div>

      <!-- LOGIN -->
      <form id="formLogin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label>Kata Sandi</label>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block mb-3">Masuk</button>
        <p class="text-center muted" style="font-size:.85rem"><a href="#" style="color:var(--primary)">Lupa kata sandi?</a></p>
      </form>

      <!-- REGISTER -->
      <form id="formRegister" style="display:none">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="regName" placeholder="Nama Anda" required>
        </div>
        <div class="form-group">
          <label>Nomor HP / WhatsApp</label>
          <input type="tel" id="regPhone" placeholder="08xxxxxxxxxx" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="nama@email.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Kata Sandi</label>
            <input type="password" id="regPass" placeholder="Min. 8 karakter" required>
          </div>
          <div class="form-group">
            <label>Ulangi Kata Sandi</label>
            <input type="password" id="regPass2" placeholder="Ulangi" required>
          </div>
        </div>
        <label class="filter-check mb-3" style="font-size:.88rem">
          <input type="checkbox" id="regAgree" required> Saya menyetujui Syarat & Ketentuan Filosovet
        </label>
        <button type="submit" class="btn btn-primary btn-block">Buat Akun</button>
      </form>
    </div>
    <p class="text-center muted mt-3" style="margin-top:1.2rem;font-size:.88rem">
      Untuk staf: <a href="dashboard-admin.html" style="color:var(--primary);font-weight:600">Masuk Dashboard Admin →</a>
    </p>
  </div>
</section>
<script>
const tLogin = document.getElementById('tabLogin'), tRegister = document.getElementById('tabRegister');
const fLogin = document.getElementById('formLogin'), fRegister = document.getElementById('formRegister');
tLogin.onclick = () => { tLogin.classList.add('active'); tRegister.classList.remove('active'); fLogin.style.display='block'; fRegister.style.display='none'; };
tRegister.onclick = () => { tRegister.classList.add('active'); tLogin.classList.remove('active'); fRegister.style.display='block'; fLogin.style.display='none'; };

fLogin.addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  localStorage.setItem('fv_user', JSON.stringify({ name: email.split('@')[0], email }));
  toast('Berhasil masuk! Mengalihkan...');
  setTimeout(() => location.href = 'profil-pelanggan.html', 900);
});
fRegister.addEventListener('submit', e => {
  e.preventDefault();
  const p1 = document.getElementById('regPass').value, p2 = document.getElementById('regPass2').value;
  if (p1.length < 8) return toast('Kata sandi minimal 8 karakter', 'error');
  if (p1 !== p2) return toast('Kata sandi tidak sama', 'error');
  const name = document.getElementById('regName').value;
  localStorage.setItem('fv_user', JSON.stringify({ name, email: document.getElementById('regEmail').value }));
  toast('Akun berhasil dibuat! Mengalihkan...');
  setTimeout(() => location.href = 'profil-pelanggan.html', 900);
});
</script>
<script src="js/dark-mode.js"></script>
</body>
</html>
<div id="footer-placeholder"></div>
<script src="js/main.js"></script>
