<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Filosovet</title>
<link rel="icon" type="image/png" href="../assets/images/logo_filosovet.png">

<!-- Pre-script anti flash tema (terang/gelap mengikuti pilihan tersimpan atau preferensi sistem) -->
<script>
  if (localStorage.getItem('fv_theme') === 'dark' || (!('fv_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark-mode');
  }
</script>

<!-- Token & komponen dasar bersama situs publik (style.css memuat tokens.css) -->
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
<a class="skip-link" href="#view">Lewati ke konten utama</a>

<div class="adm" id="adm">
  <!-- SIDEBAR -->
  <aside class="sb" id="sidebar" aria-label="Menu admin">
    <div class="sb-head">
      <a href="../index.html" class="sb-brand" title="Kembali ke situs Filosovet"><img src="../assets/images/logo_filosovet.png" alt="Filosovet" class="sb-logo"></a>
      <button type="button" class="icon-btn sb-collapse" id="btnCollapse" aria-label="Ciutkan sidebar" aria-expanded="true"></button>
    </div>
    <nav class="sb-nav" id="sbNav" aria-label="Halaman admin"></nav>
    <div class="sb-foot"><a class="sb-item" href="../index.html" title="Lihat situs publik"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span class="sb-label">Lihat situs</span></a></div>
  </aside>
  <div class="sb-scrim" id="sbScrim"></div>

  <div class="main">
    <!-- HEADER -->
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="btnMenu" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false"></button>
      <div class="tb-title"><h1 id="pageTitle">Dashboard</h1><p id="todayLabel"></p></div>

      <div class="tb-search" role="search">
        <span class="tb-search-ico" id="srIcon" aria-hidden="true"></span>
        <label class="sr-only" for="gSearch">Cari pelanggan, kode booking, nomor nota, atau produk</label>
        <input type="search" id="gSearch" placeholder="Cari pelanggan, booking, nota, produk…  ( / )" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gResults" aria-autocomplete="list">
        <div class="sr-box" id="gResults" role="listbox" aria-label="Hasil pencarian" hidden></div>
      </div>

      <div class="tb-actions">
        <div class="tb-notif">
          <button type="button" class="icon-btn" id="btnNotif" aria-label="Notifikasi" aria-haspopup="true" aria-expanded="false"></button>
          <div class="dropdown" id="notifPanel" hidden>
            <div class="dd-head"><strong>Notifikasi</strong><button type="button" class="btn btn-ghost btn-sm" id="notifMark"></button></div>
            <ul id="notifList" class="notif-list"></ul>
          </div>
        </div>
        <div class="tb-acct">
          <button type="button" class="acct-btn" id="btnAcct" aria-haspopup="true" aria-expanded="false" aria-label="Menu akun">
            <span class="avatar" id="acctAvatar">A</span><span class="acct-name" id="acctName">Admin</span>
          </button>
          <div class="dropdown acct" id="acctPanel" hidden></div>
        </div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>

<div id="layerRoot"></div>

<script src="../js/cart.js"></script>
<script src="../js/main.js"></script>
<script src="../js/services-data.js"></script>
<script src="../js/admin/core.js"></script>
<script src="../js/admin/ui.js"></script>
<script src="../js/admin/dashboard.js"></script>
<script src="../js/admin/booking.js"></script>
<script src="../js/admin/inventory.js"></script>
<script src="../js/admin/finance.js"></script>
<script src="../js/admin/shell.js"></script>
</body>
</html>
