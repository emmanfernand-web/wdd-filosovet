<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Produk &amp; Farmasi | Filosovet Petshop &amp; Klinik Hewan</title>
<link rel="icon" type="image/png" href="../assets/images/logo_filosovet.png">

<!-- Pre-script Anti Flashing Dark Mode -->
<script>
  if (localStorage.getItem('fv_theme') === 'dark' || (!('fv_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark-mode');
  }
</script>

  <!-- CSS Utama -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/shop.css">

  <!-- CSS Komponen Terpisah -->
  <link rel="stylesheet" href="../css/components/header.css">
  <link rel="stylesheet" href="../css/components/footer.css">
  
  <!-- CSS Mode Malam -->
  <link rel="stylesheet" href="../css/dark.css">
</head>
<body>

<!-- HEADER: dimuat dari components/header.html -->
<div id="header-placeholder"></div>

<!-- HERO SUB PAGE -->
<section class="page-hero">
  <div class="container">
    <h1>Toko Produk &amp; Farmasi</h1>
    <p class="page-sub">Pakan, obat, skincare, dan aksesori pilihan untuk anabul Anda.</p>
    <div class="breadcrumb"><a href="../index.html">Beranda</a> / Toko</div>
  </div>
</section>

<!-- KONTEN TOKO -->
<section class="section">
  <div class="container shop-layout">
    
    <!-- FILTER SIDEBAR (KIRI PADA DESKTOP, POPUP/COLLAPSE PADA MOBILE) -->
    <aside class="card filter-card no-hover" id="filterSidebar" aria-label="Filter produk">
      <div class="filter-card-header">
        <h3>Filter Produk</h3>
      </div>

      <div class="filter-group">
        <span class="filter-label" id="catLabel">Kategori</span>
        <div id="catFilters" role="group" aria-labelledby="catLabel">
          <label class="filter-check"><input type="checkbox" value="makanan"> Makanan Hewan</label>
          <label class="filter-check"><input type="checkbox" value="obat"> Obat &amp; Vitamin</label>
          <label class="filter-check"><input type="checkbox" value="skincare"> Skincare</label>
          <label class="filter-check"><input type="checkbox" value="aksesoris"> Aksesoris</label>
          <label class="filter-check"><input type="checkbox" value="almed"> Alat Medis</label>
        </div>
      </div>

      <div class="filter-group">
        <label for="sortSelect">Urutkan</label>
        <select id="sortSelect">
          <option value="populer">Paling populer</option>
          <option value="price-asc">Harga termurah</option>
          <option value="price-desc">Harga termahal</option>
          <option value="name-asc">Nama A–Z</option>
        </select>
      </div>

      <button class="btn btn-outline btn-sm btn-block" id="resetFilter">Reset Filter</button>
    </aside>

    <!-- AREA UTAMA TOKO (SEARCH BAR, BUTTON FILTER MOBILE, & GRID PRODUK) -->
    <div class="shop-main-content">
      
      <!-- SEARCH + CHIP KATEGORI (CHIP KHUSUS MOBILE) -->
      <div class="shop-top-bar">
        <div class="search-box main-search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="searchInput" placeholder="Cari makanan, obat, aksesoris..." aria-label="Cari produk">
        </div>
      </div>

      <div class="cat-chips" id="catChips" role="group" aria-label="Filter kategori"></div>

      <div class="shop-result-row">
        <p class="muted" id="resultInfo" aria-live="polite"></p>
        <label class="sort-mobile" for="sortSelectM"><span class="sr-only">Urutkan</span>
          <select id="sortSelectM">
            <option value="populer">Paling populer</option>
            <option value="price-asc">Harga termurah</option>
            <option value="price-desc">Harga termahal</option>
            <option value="name-asc">Nama A–Z</option>
          </select>
        </label>
      </div>

      <!-- GRID PRODUK (skeleton tampil sampai data dirender) -->
      <div class="product-grid" id="productGrid" aria-busy="true">
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
        <div class="product-card product-skeleton" aria-hidden="true"><div class="product-thumb"></div><div class="product-body"><span class="sk sk-s"></span><span class="sk"></span><span class="sk sk-m"></span><span class="sk sk-btn"></span></div></div>
      </div>
    </div>

  </div>
</section>
<!-- FOOTER: dimuat dari components/footer.html -->
<div id="footer-placeholder"></div>

<!-- SCRIPTS -->
<script src="../js/cart.js"></script>
<script src="../js/toko.js"></script>
<script src="../js/main.js"></script>
<script src="../js/dark-mode.js"></script>
</body>
</html>
